<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.emailjs.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.google.com/recaptcha/;">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>אתגר | יסודות בטיחות</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page-title="אתגר" data-game-page="challenge" class="auth-protected">
  <a class="skip-link" href="#main">דלג לתוכן</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html"><span class="brand-mark">EHS</span><span><strong>קורס ממונה בטיחות</strong><small>אתגר בטיחות</small></span></a>
      <nav class="main-nav" aria-label="ניווט ראשי"><a href="../index.html">בית</a><a href="syllabus.html">שיעורים</a><a href="quizzes.html">תרגול ומבחנים</a><a href="safety-game.html">אתגר בטיחות</a><a href="field-tools.html">חוקים, תקנים וכלי שטח</a><a href="ai-assistant.html">עוזר AI</a></nav>
      <div class="header-actions"><button class="icon-btn" type="button" data-action="toggle-theme" title="מצב כהה">◐</button></div>
    </div>
  </header>
  <main id="main" class="site-main gv2-shell gv2-challenge-shell">
    <section class="gv2-challenge-topbar" aria-label="מצב שאלה">
      <a class="btn secondary" href="game-unit.html?unit=unit-foundations">חזור למסלול</a>
      <div>
        <p id="challengeStageTitle" class="kicker">יסודות בטיחות</p>
        <strong id="challengeCounter">1/5</strong>
        <span id="challengeDifficulty" class="status-pill">רמה: בינוני</span>
      </div>
    </section>

    <progress id="challengeProgress" class="gv2-progress-bar game-progress-bar" max="100" value="0"></progress>

    <section class="challenge-card gv2-challenge-card">
      <div class="challenge-head gv2-challenge-head">
        <div>
          <div id="challengeTags" class="gv2-tags" aria-label="סוג אתגר"></div>
          <h1 id="challengeTitle">טוען אתגר...</h1>
        </div>
      </div>
      <p id="challengePrompt" class="challenge-question gv2-question"></p>
      <p id="challengeQuestion" class="visually-hidden"></p>
      <div id="answerArea" class="answer-area gv2-answer-grid"></div>
      <div id="challengeOptions" class="visually-hidden"></div>
      <p id="challengeHint" class="challenge-hint gv2-hint" hidden></p>
      <div id="challengeFeedback" class="challenge-feedback gv2-feedback" hidden></div>
      <div id="adaptiveSuggestion" class="adaptive-suggestion" hidden></div>
    </section>

    <div class="form-actions challenge-actions gv2-sticky-actions">
      <button class="btn secondary" type="button" id="showHint">רמז</button>
      <button class="btn" type="button" id="checkAnswer" disabled>בדוק תשובה</button>
      <button class="btn" type="button" id="nextChallenge" hidden>המשך</button>
    </div>
  </main>
  <footer class="site-footer">האתר נוצר על ידי אושר פרץ<br>טלפון: 054-4232490<br>Email: <a href="mailto:osherper@gmail.com">osherper@gmail.com</a></footer>
  <script src="../data/course-data.js"></script>
  <script src="../data/game-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/game-state.js"></script>
  <script src="../js/game-challenge.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
